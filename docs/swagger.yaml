definitions:
  models.CreateStudentRequest:
    properties:
      age:
        type: integer
      email:
        type: string
      name:
        type: string
    type: object
  models.Student:
    properties:
      age:
        type: integer
      created_at:
        type: string
      email:
        type: string
      id:
        type: integer
      name:
        type: string
    type: object
  models.UpdateStudentRequest:
    properties:
      age:
        type: integer
      email:
        type: string
      name:
        type: string
    type: object
info:
  contact: {}
  description: REST API for managing student records.
  title: Student REST API
  version: "1.0"
paths:
  /students:
    get:
      description: Returns a list of all students
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.Student'
            type: array
        "500":
          description: Failed to retrieve students
          schema:
            type: string
      summary: Get all students
      tags:
      - Students
    post:
      consumes:
      - application/json
      description: Creates a new student record
      parameters:
      - description: Student details
        in: body
        name: student
        required: true
        schema:
          $ref: '#/definitions/models.CreateStudentRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.Student'
        "400":
          description: Invalid JSON or invalid student details
          schema:
            type: string
        "409":
          description: Email already exists
          schema:
            type: string
        "500":
          description: Failed to create student
          schema:
            type: string
      summary: Create a new student
      tags:
      - Students
  /students/{id}:
    delete:
      description: Deletes a student with the specified ID
      parameters:
      - description: Student ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "204":
          description: Student deleted successfully
        "400":
          description: Invalid student ID
          schema:
            type: string
        "404":
          description: Student not found
          schema:
            type: string
        "500":
          description: Failed to delete student
          schema:
            type: string
      summary: Delete student by ID
      tags:
      - Students
    get:
      description: Returns a student with the specified ID
      parameters:
      - description: Student ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Student'
        "400":
          description: Invalid student ID
          schema:
            type: string
        "404":
          description: Student not found
          schema:
            type: string
        "500":
          description: Failed to retrieve student
          schema:
            type: string
      summary: Get student by ID
      tags:
      - Students
    put:
      consumes:
      - application/json
      description: Updates the details of an existing student
      parameters:
      - description: Student ID
        in: path
        name: id
        required: true
        type: integer
      - description: Updated student details
        in: body
        name: student
        required: true
        schema:
          $ref: '#/definitions/models.UpdateStudentRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Student'
        "400":
          description: Invalid student ID, JSON or student details
          schema:
            type: string
        "404":
          description: Student not found
          schema:
            type: string
        "409":
          description: Email already exists
          schema:
            type: string
        "500":
          description: Failed to update student
          schema:
            type: string
      summary: Update an existing student
      tags:
      - Students
swagger: "2.0"
